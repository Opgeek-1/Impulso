name: Version log check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version-log.ts was updated
        run: |
          if git diff --name-only origin/main...HEAD | grep -q 'src/lib/version-log.ts'; then
            echo "version-log.ts was updated"
          else
            echo "::warning::src/lib/version-log.ts was not updated in this PR. If this is a release, remember to add a new entry to the version log."
          fi
