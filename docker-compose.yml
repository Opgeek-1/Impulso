services:
  postgres:
    image: postgres:17-alpine
    container_name: impulso-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: impulso
      POSTGRES_USER: impulso
      POSTGRES_PASSWORD: impulso_dev_password
    ports:
      - "54329:5432"
    volumes:
      - impulso_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impulso -d impulso"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  impulso_postgres_data:
